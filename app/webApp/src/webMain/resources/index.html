<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResidManager</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>

    <!-- Hidden accessible form for browser password manager integration -->
    <form id="credential-autofill-bridge" style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; overflow: hidden;" autocomplete="on">
        <label for="autofill-email">Email</label>
        <input type="email" id="autofill-email" name="username" autocomplete="username email" tabindex="-1">
        <label for="autofill-password">Password</label>
        <input type="password" id="autofill-password" name="password" autocomplete="current-password" tabindex="-1">
    </form>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
